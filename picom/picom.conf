#################################
#            Shadow             #
#################################
shadow = true;
shadow-radius = 12;
shadow-offset-x = -17;
shadow-offset-y = -7;
shadow-opacity = 0.5;
shadow-exclude = [
  "class_g = 'firefox' && argb",
  "x = 0 && y = 0 && override_redirect = true",
  "_NET_WM_NAME@:s = 'discord'",
  "_NET_WM_NAME@:s = 'Steam'",
  "_NET_WM_NAME@:s = 'TelegramDesktop'"
];

#################################
#            Fading             #
#################################
fading = true;
fade-delta = 4;          # em ms; no picom novo, 0.25 não faz sentido
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-exclude = [ ];

#################################
#           Opacity             #
#################################
active-opacity = 1.0;
frame-opacity = 0.7;
opacity-rule = [ "93:class_g = 'Code'" ];

#################################
#            Other              #
#################################
backend = "glx";
vsync = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
invert-color-include = [ ];

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'CoverGloobus'",
  "class_g = 'Tilda'",
  "class_g = 'firefox'",
  "class_g = 'Firefox-esr'"
];

#################################
#            Blur               #
#################################
blur-method = "dual_kawase";
blur-strength = 8;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "class_g = 'firefox'",
  "class_g = 'zoom'"
];

#################################
#     Window type settings      #
#################################
wintypes:
{
  tooltip       = { fade = true; shadow = true; opacity = 0.75; focus = true; };
  dropdown_menu = { shadow = false; };
  popup_menu    = { shadow = false; };
  utility       = { shadow = false; };
};